<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carte Obesite &mdash; Editeur des associations</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
<style>
  :root{--slate:#2b3242;--slate-2:#3a4256;--ink:#1c2230;--violet:#A2368F;--violet-soft:#f7ecf5;
    --teal:#0e8a7d;--paper:#f6f7f9;--line:#e3e6ec;--muted:#6b7280;--ok:#0e8a7d;--no:#c0392b;}
  *{box-sizing:border-box;} html,body{height:100%;margin:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);
    background:var(--paper);display:flex;flex-direction:column;height:100vh;overflow:hidden;}
  header{background:var(--slate);color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  header .brand{display:flex;align-items:center;gap:10px;}
  header h1{font-size:14px;margin:0;font-weight:600;}
  header .dot{width:24px;height:24px;border-radius:6px;background:var(--violet);display:grid;place-items:center;}
  header .dot svg{width:14px;height:14px;}
  .htools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .htools button{border:0;cursor:pointer;font:inherit;font-size:12px;font-weight:600;padding:7px 12px;border-radius:7px;display:inline-flex;align-items:center;gap:6px;}
  .b-save{background:var(--violet);color:#fff;} .b-ghost{background:var(--slate-2);color:#e7eaf1;}
  .b-mode{background:transparent;color:#c7cdda;border:1px solid rgba(255,255,255,.25)!important;}
  .b-mode.on{background:#fff;color:var(--ink);}
  .layout{flex:1;display:flex;min-height:0;}
  aside{width:260px;border-right:1px solid var(--line);background:#fff;display:flex;flex-direction:column;min-height:0;}
  .search{padding:10px;border-bottom:1px solid var(--line);}
  .search input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:13px;}
  .liste{flex:1;overflow:auto;}
  .item{padding:9px 12px;border-bottom:1px solid #f0f1f4;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:8px;}
  .item:hover{background:var(--paper);} .item.sel{background:var(--violet-soft);font-weight:600;}
  .item .pastille{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:0 0 auto;}
  .item.inactif .pastille{background:#c9ccd2;} .item.inactif{color:var(--muted);}
  .add{padding:10px;border-top:1px solid var(--line);}
  .add button{width:100%;background:var(--paper);border:1px dashed var(--line);border-radius:8px;padding:9px;font:inherit;font-weight:600;color:var(--slate);cursor:pointer;}
  main{flex:1;overflow:auto;padding:18px 22px;min-height:0;}
  .navbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .navbar button{border:1px solid var(--line);background:#fff;border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:15px;color:var(--slate);}
  .navbar .pos{font-size:12px;color:var(--muted);}
  .navbar .del{margin-left:auto;background:#fff;border:1px solid #f0d0d0;color:var(--no);border-radius:8px;padding:0 12px;height:34px;cursor:pointer;font:inherit;font-weight:600;font-size:12px;}
  .champ{margin-bottom:14px;} .champ label{display:block;font-size:11px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--slate);margin-bottom:5px;}
  .champ input[type=text],.champ textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font:inherit;font-size:13px;}
  .champ textarea{resize:vertical;line-height:1.5;}
  .champ textarea.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;min-height:220px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .cats{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .tri{border:1px solid var(--line);border-radius:9px;padding:9px 11px;}
  .tri .t-lbl{font-size:12px;font-weight:600;margin-bottom:6px;}
  .tri .opts{display:flex;gap:4px;}
  .tri .opts button{flex:1;border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;color:var(--muted);}
  .tri .opts button.oui.on{background:var(--ok);color:#fff;border-color:var(--ok);}
  .tri .opts button.non.on{background:var(--no);color:#fff;border-color:var(--no);}
  .tri .opts button.vide.on{background:var(--slate);color:#fff;border-color:var(--slate);}
  .preview{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#fff;font-size:13px;line-height:1.45;max-height:340px;overflow:auto;}
  .preview table{border-collapse:collapse;width:100%;font-size:12px;margin:6px 0;} .preview td,.preview th{border:1px solid var(--line);padding:5px 7px;}
  .preview td:first-child{text-align:center;width:22px;} .preview a{color:var(--teal);}
  .preview .adr-titre{font-weight:700;color:var(--slate);margin:9px 0 3px;} .preview .adresse{margin:2px 0;}
  .sect-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);margin:18px 0 8px;}
  /* import */
  .import{display:none;} body.mode-import .edit{display:none;} body.mode-import .import{display:block;}
  .imp-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .imp-src textarea{width:100%;min-height:420px;border:1px solid var(--line);border-radius:8px;padding:11px;font:inherit;font-size:13px;line-height:1.5;}
  .imp-fields{max-height:480px;overflow:auto;padding-right:4px;}
  .imp-field{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px;}
  .imp-field .fh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px;}
  .imp-field .fh .name{font-size:12px;font-weight:600;color:var(--slate);}
  .imp-field .fh button{border:1px solid var(--violet);background:var(--violet-soft);color:var(--violet);border-radius:6px;font:inherit;font-size:11px;font-weight:600;padding:4px 8px;cursor:pointer;white-space:nowrap;}
  .imp-field textarea{width:100%;min-height:34px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit;font-size:12px;resize:vertical;}
  .imp-actions{margin-top:14px;display:flex;gap:10px;align-items:center;}
  .imp-actions .inject{background:var(--violet);color:#fff;border:0;border-radius:8px;padding:11px 20px;font:inherit;font-weight:700;cursor:pointer;font-size:13px;}
  .imp-actions .hint{font-size:12px;color:var(--muted);}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--slate);color:#fff;padding:10px 18px;border-radius:9px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:100;}
  .toast.show{opacity:1;}
  @media (max-width:820px){aside{width:200px;} .grid2,.cats,.imp-grid{grid-template-columns:1fr;}}
</style>
</head>
<body class="mode-edit">
<header>
  <div class="brand"><span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.5-7-11a7 7 0 0 1 14 0c0 4.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.6"/></svg></span>
    <h1>Editeur des associations</h1></div>
  <div class="htools">
    <button class="b-mode on" id="m-edit" type="button">Edition</button>
    <button class="b-mode" id="m-import" type="button">Import</button>
    <input type="file" id="file" accept=".geojson,.json" style="display:none">
    <button class="b-ghost" id="b-open" type="button"><i class="fa fa-folder-open"></i> Charger</button>
    <span id="maj-label" style="font-size:11px;color:#c7cdda;align-self:center;"></span>
    <button class="b-save" id="b-save" type="button"><i class="fa fa-download"></i> Sauvegarder</button>
  </div>
</header>

<div class="layout">
  <aside>
    <div class="search"><input type="text" id="q" placeholder="Rechercher une association..."></div>
    <div class="liste" id="liste"></div>
    <div class="add"><button id="b-add"><i class="fa fa-plus"></i> Ajouter une association</button></div>
  </aside>

  <main>
    <!-- MODE EDITION -->
    <div class="edit">
      <div class="navbar">
        <button id="prev" title="Precedente">&lsaquo;</button>
        <button id="next" title="Suivante">&rsaquo;</button>
        <span class="pos" id="pos"></span>
        <button class="del" id="b-del"><i class="fa fa-trash"></i> Supprimer</button>
      </div>

      <div class="grid2">
        <div class="champ"><label>Nom de l&rsquo;association</label><input type="text" id="f-nom"></div>
        <div class="champ"><label>Logo (fichier dans pict/)</label><input type="text" id="f-logo" placeholder="pict/mon-asso.png"></div>
      </div>
      <div class="grid2">
        <div class="champ"><label>Longitude</label><input type="text" id="f-lng"></div>
        <div class="champ"><label>Latitude</label><input type="text" id="f-lat"></div>
      </div>
      <div class="champ"><label>Statut</label>
        <div class="tri" style="max-width:220px"><div class="opts">
          <button class="oui" data-act="1">Active</button><button class="non" data-act="0">Inactive</button>
        </div></div>
      </div>

      <div class="sect-title">Cases (vide = non exportee)</div>
      <div class="cats" id="cats"></div>

      <div class="sect-title">Fiche (Markdown / syntaxe icones)</div>
      <div class="grid2">
        <div class="champ"><label>Source</label><textarea class="mono" id="f-fiche"></textarea></div>
        <div class="champ"><label>Apercu</label><div class="preview" id="preview"></div></div>
      </div>
    </div>

    <!-- MODE IMPORT -->
    <div class="import">
      <div class="sect-title">Import assiste &mdash; collez la source a droite, affectez chaque bloc a la bonne case, puis injectez</div>
      <div class="imp-grid">
        <div class="imp-fields" id="imp-fields"></div>
        <div class="imp-src">
          <label style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--slate);display:block;margin-bottom:5px;">Texte source</label>
          <textarea id="imp-source" placeholder="Collez ici le texte brut de l&rsquo;association. Selectionnez un passage, puis cliquez sur &laquo; coller &raquo; en face de la case voulue."></textarea>
        </div>
      </div>
      <div class="imp-actions">
        <button class="inject" id="b-inject"><i class="fa fa-download"></i> Injecter dans la fiche</button>
        <span class="hint">Injecte dans l&rsquo;association actuellement selectionnee.</span>
      </div>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>

    return y?'<div style="color:#888;font-size:12px">[video '+y[1]+']</div>':'<a href="'+url+'">'+url+'</a>';});
  txt=txt.replace(/\[([^\]]+)\]\(app:\/\/moveTo\?[^)]*\)/g,"$1");
  txt=txt.replace(/\[----\]/g,"");
  txt=txt.replace(/\[--\s*(.+?)\s*--\]/g,'\n<div class="adr-titre">$1</div>\n');
  txt=txt.replace(/^[ \t]*:fa-plus-square:(?::?#[0-9a-fA-F]{3,6}:)?[ \t]*\|?[ \t]*(.+)$/gm,'<div class="adresse"><i class="fa fa-plus-square" style="color:#A2368F"></i> $1</div>');
  txt=txt.replace(/\*\*[ \t]*(.+?)[ \t]*\*\*/g,"**$1**");
  txt=txt.replace(/:fa-([a-z0-9-]+):(?::?#([0-9a-fA-F]{3,6}):)?/g,function(m,n,h){return h?'<i class="fa fa-'+n+'" style="color:#'+h+'"></i>':'<i class="fa fa-'+n+'"></i>';});
  return txt;
}
marked.setOptions({breaks:true,gfm:true});
function rafraichirApercu(){document.getElementById("preview").innerHTML=marked.parse(preprocessFiche(document.getElementById("f-fiche").value||""));}

/* ---------- liste ---------- */
function rendreListe(){
  var el=document.getElementById("liste");el.innerHTML="";
  data.features.forEach(function(f,i){
    var nom=f.properties.nom||"(sans nom)";
    if(filtre && nom.toLowerCase().indexOf(filtre)<0) return;
    var d=document.createElement("div");
    d.className="item"+(i===cur?" sel":"")+(f.properties.active===false?" inactif":"");
    d.innerHTML='<span class="pastille"></span>'+nom;
    d.addEventListener("click",function(){selectionner(i);});
    el.appendChild(d);
  });
}

/* ---------- selection / edition ---------- */
function props(){return data.features[cur].properties;}
function coords(){return data.features[cur].geometry.coordinates;}

function selectionner(i){sauverChamps();cur=i;chargerChamps();rendreListe();}

function chargerChamps(){
  if(!data.features.length){document.getElementById("pos").textContent="0 / 0";return;}
  var p=props(),c=coords();
  document.getElementById("f-nom").value=p.nom||"";
  document.getElementById("f-logo").value=p.logo||"";
  document.getElementById("f-lng").value=c[0];
  document.getElementById("f-lat").value=c[1];
  document.getElementById("pos").textContent=(cur+1)+" / "+data.features.length;
  // statut
  document.querySelectorAll('.tri [data-act]').forEach(function(b){b.classList.toggle("on",(b.dataset.act==="1")===(p.active!==false));});
  // cats
  CATS.forEach(function(cc){
    var v=p[cc[0]]===undefined?"":p[cc[0]];
    document.querySelectorAll('[data-cat="'+cc[0]+'"] button').forEach(function(b){b.classList.toggle("on",b.dataset.val===v);});
  });
  document.getElementById("f-fiche").value=p.fiche||"";
  rafraichirApercu();
}

function sauverChamps(){
  if(!data.features.length) return;
  var p=props(),c=coords();
  p.nom=document.getElementById("f-nom").value.trim();
  p.logo=document.getElementById("f-logo").value.trim();
  var lng=parseFloat(document.getElementById("f-lng").value),lat=parseFloat(document.getElementById("f-lat").value);
  if(!isNaN(lng))c[0]=lng; if(!isNaN(lat))c[1]=lat;
  p.fiche=document.getElementById("f-fiche").value;
}

/* statut tri */
document.querySelectorAll('.tri [data-act]').forEach(function(b){b.addEventListener("click",function(){
  props().active=(b.dataset.act==="1");
  document.querySelectorAll('.tri [data-act]').forEach(function(x){x.classList.toggle("on",x===b);});
  rendreListe();
});});

/* cats UI */
(function(){var host=document.getElementById("cats");
  CATS.forEach(function(cc){
    var box=document.createElement("div");box.className="tri";box.setAttribute("data-cat",cc[0]);
    box.innerHTML='<div class="t-lbl">'+cc[1]+'</div><div class="opts">'+
      '<button class="oui" data-val="oui">Oui</button>'+
      '<button class="non" data-val="non">Non</button>'+
      '<button class="vide" data-val="">Vide</button></div>';
    box.querySelectorAll("button").forEach(function(b){b.addEventListener("click",function(){
      var v=b.dataset.val;
      if(v==="") delete props()[cc[0]]; else props()[cc[0]]=v;
      box.querySelectorAll("button").forEach(function(x){x.classList.toggle("on",x===b);});
    });});
    host.appendChild(box);
  });
})();

/* champs live */
document.getElementById("f-fiche").addEventListener("input",rafraichirApercu);
document.getElementById("f-nom").addEventListener("input",function(){props().nom=this.value;rendreListe();});

/* navigation */
document.getElementById("prev").addEventListener("click",function(){if(cur>0)selectionner(cur-1);});
document.getElementById("next").addEventListener("click",function(){if(cur<data.features.length-1)selectionner(cur+1);});
document.getElementById("q").addEventListener("input",function(){filtre=this.value.toLowerCase().trim();rendreListe();});

/* ajouter / supprimer */
document.getElementById("b-add").addEventListener("click",function(){
  sauverChamps();
  data.features.push({type:"Feature",geometry:{type:"Point",coordinates:[2.4,46.7]},
    properties:{nom:"Nouvelle association",active:true,logo:"pict/nouvelle-association.png",fiche:""}});
  cur=data.features.length-1;chargerChamps();rendreListe();toast("Association ajoutee");
});
document.getElementById("b-del").addEventListener("click",function(){
  if(!data.features.length)return;
  if(!confirm("Supprimer \""+(props().nom||"")+"\" ?"))return;
  data.features.splice(cur,1); if(cur>=data.features.length)cur=Math.max(0,data.features.length-1);
  chargerChamps();rendreListe();toast("Association supprimee");
});

/* sauvegarde (telechargement + localStorage) */
function nettoyerPourExport(){
  var out={type:"FeatureCollection",features:data.features.map(function(f){
    var p=f.properties,np={nom:p.nom||"",active:p.active!==false,logo:p.logo||"",fiche:p.fiche||""};
    CATS.forEach(function(cc){if(p[cc[0]]==="oui"||p[cc[0]]==="non")np[cc[0]]=p[cc[0]];}); // vide => omis
    return {type:"Feature",geometry:f.geometry,properties:np};
  })};
  return out;
}
document.getElementById("b-save").addEventListener("click",function(){
  sauverChamps();
  var out=nettoyerPourExport();
  out.date_maj=dateAuj(); data.date_maj=out.date_maj; majAffichageDate();
  store.set("data",data);
  var blob=new Blob([JSON.stringify(out,null,1)],{type:"application/geo+json"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="Carte_Obesite.geojson";a.click();
  toast("GeoJSON sauvegarde ("+out.features.length+" assos)");
});

/* charger un geojson */
document.getElementById("b-open").addEventListener("click",function(){document.getElementById("file").click();});
document.getElementById("file").addEventListener("change",function(){
  var f=this.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{var j=JSON.parse(r.result);if(!j.features)throw 0;data=j;cur=0;chargerChamps();rendreListe();majAffichageDate();toast("Charge : "+data.features.length+" assos");}catch(e){alert("GeoJSON invalide");}};
  r.readAsText(f);
});

/* ---------- MODE IMPORT ---------- */
const IMPORT_FIELDS=[
  ["adresse","Adresse"],["courriel","Courriel (email)"],["telephone","Telephone"],
  ["site","Site web (url)"],["facebook","Facebook (url)"],["instagram","Instagram (url)"],
  ["brochure","Brochure (url)"],["public","Public accepte"],["mode","Mode d echanges"],
  ["affiliation","Affiliation"],["partenariat","Partenariat"],["agrements","Agrements"],
  ["composition","Composition"],["rna","N RNA (W...)"],["enregistree","Enregistree le"],
  ["maj","Fiche MaJ le"],["presentation","Presentation"],["video","Video (url)"]
];
var lastFocusField=null;
(function(){var host=document.getElementById("imp-fields");
  IMPORT_FIELDS.forEach(function(f){
    var d=document.createElement("div");d.className="imp-field";
    d.innerHTML='<div class="fh"><span class="name">'+f[1]+'</span><button data-k="'+f[0]+'">&laquo; coller</button></div>'+
      '<textarea data-fk="'+f[0]+'"></textarea>';
    host.appendChild(d);
  });
  host.querySelectorAll('button[data-k]').forEach(function(b){b.addEventListener("click",function(){
    var src=document.getElementById("imp-source");
    var sel=src.value.substring(src.selectionStart,src.selectionEnd).trim();
    if(!sel){toast("Selectionnez d abord un passage dans la source");return;}
    var ta=host.querySelector('textarea[data-fk="'+b.dataset.k+'"]');
    ta.value=(ta.value?ta.value+"\n":"")+sel;
  });});
})();

function val(k){var t=document.querySelector('#imp-fields textarea[data-fk="'+k+'"]');return t?t.value.trim():"";}
function br(s){return s.replace(/\n/g,"<br>");}
function ligne(icon,contenu){return "| :fa-"+icon+"::#A2368F:|"+contenu+"|";}

document.getElementById("b-inject").addEventListener("click",function(){
  if(!data.features.length){toast("Ajoutez d abord une association");return;}
  var L=[];
  L.push(ligne("info","**Identification**").replace("::#A2368F:",":#A2368F:")); // entete
  L.push("| ---- | ---- |");
  if(val("adresse")) L.push(ligne("map-o",br(val("adresse"))));
  if(val("courriel")) L.push(ligne("envelope","[Courriel](mailto:"+val("courriel")+")"));
  if(val("telephone")) L.push(ligne("mobile",br(val("telephone"))));
  if(val("site")) L.push(ligne("chain","[Site web]("+val("site")+")"));
  if(val("facebook")) L.push(ligne("facebook-official","[Facebook]("+val("facebook")+")"));
  if(val("instagram")) L.push(ligne("instagram","[Instagram]("+val("instagram")+")"));
  if(val("brochure")) L.push(ligne("file-pdf-o","[Brochure]("+val("brochure")+")"));
  if(val("public")) L.push(ligne("users","Public accepte : "+br(val("public"))));
  if(val("mode")) L.push(ligne("circle-o-notch","Mode d echanges : "+br(val("mode"))));
  if(val("affiliation")) L.push(ligne("tag","Affiliation: "+br(val("affiliation"))));
  if(val("partenariat")) L.push(ligne("external-link","Partenariat avec : "+br(val("partenariat"))));
  if(val("agrements")) L.push(ligne("certificate","Agrements : "+br(val("agrements"))));
  if(val("composition")) L.push(ligne("user","Composition: "+br(val("composition"))));
  if(val("rna")) L.push(ligne("gear",val("rna")));
  if(val("enregistree")) L.push(ligne("calendar","Enregistree le "+val("enregistree")));
  if(val("maj")) L.push(ligne("refresh","Fiche Maj le "+val("maj")));
  var out=L.join("\n");
  if(val("presentation")) out+="\n\n** :fa-newspaper-o: Presentation de l association**\n"+val("presentation");
  if(val("video")) out+="\n\n** :fa-film: Video**\n!("+val("video")+" 400x220)";
  props().fiche=out;
  document.getElementById("f-fiche").value=out;rafraichirApercu();
  basculer("edit");toast("Fiche injectee");
});

/* ---------- modes ---------- */
function basculer(mode){
  document.body.className="mode-"+mode;
  document.getElementById("m-edit").classList.toggle("on",mode==="edit");
  document.getElementById("m-import").classList.toggle("on",mode==="import");
}
document.getElementById("m-edit").addEventListener("click",function(){basculer("edit");});
document.getElementById("m-import").addEventListener("click",function(){basculer("import");});

/* toast */
var toastT;
function toast(msg){var t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove("show");},1800);}

/* init */
chargerChamps();rendreListe();majAffichageDate();
</script>
