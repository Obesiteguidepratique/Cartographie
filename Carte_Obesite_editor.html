<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carte Obésité — Éditeur</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
<style>
  :root{--slate:#2b3242;--slate-2:#3a4256;--ink:#1c2230;--violet:#A2368F;--violet-soft:#f7ecf5;--teal:#0e8a7d;--paper:#f6f7f9;--line:#e3e6ec;--muted:#6b7280;--ok:#0e8a7d;--no:#c0392b;}
  *{box-sizing:border-box;} html,body{height:100%;margin:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--paper);display:flex;flex-direction:column;height:100vh;overflow:hidden;}
  header{background:var(--slate);color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  header .brand{display:flex;align-items:center;gap:10px;} header h1{font-size:14px;margin:0;font-weight:600;}
  header .dot{width:24px;height:24px;border-radius:6px;background:var(--violet);display:grid;place-items:center;} header .dot svg{width:14px;height:14px;}
  .htools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .htools button{border:0;cursor:pointer;font:inherit;font-size:12px;font-weight:600;padding:7px 12px;border-radius:7px;display:inline-flex;align-items:center;gap:6px;}
  .b-save{background:var(--violet);color:#fff;} .b-ghost{background:var(--slate-2);color:#e7eaf1;}
  .b-mode{background:transparent;color:#c7cdda;border:1px solid rgba(255,255,255,.25)!important;} .b-mode.on{background:#fff;color:var(--ink);}
  #maj-label{font-size:11px;color:#c7cdda;align-self:center;}
  .layout{flex:1;display:flex;min-height:0;}
  aside{width:250px;border-right:1px solid var(--line);background:#fff;display:flex;flex-direction:column;min-height:0;}
  .search{padding:10px;border-bottom:1px solid var(--line);} .search input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:13px;}
  .liste{flex:1;overflow:auto;}
  .item{padding:9px 12px;border-bottom:1px solid #f0f1f4;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:8px;}
  .item:hover{background:var(--paper);} .item.sel{background:var(--violet-soft);font-weight:600;}
  .item .pastille{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:0 0 auto;} .item.inactif .pastille{background:#c9ccd2;} .item.inactif{color:var(--muted);}
  .add{padding:10px;border-top:1px solid var(--line);} .add button{width:100%;background:var(--paper);border:1px dashed var(--line);border-radius:8px;padding:9px;font:inherit;font-weight:600;color:var(--slate);cursor:pointer;}
  main{flex:1;overflow:auto;padding:18px 22px;min-height:0;}
  .navbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .navbar button{border:1px solid var(--line);background:#fff;border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:15px;color:var(--slate);}
  .navbar .pos{font-size:12px;color:var(--muted);}
  .navbar .del{margin-left:auto;background:#fff;border:1px solid #f0d0d0;color:var(--no);border-radius:8px;padding:0 12px;height:34px;cursor:pointer;font:inherit;font-weight:600;font-size:12px;}
  .champ{margin-bottom:14px;} .champ label{display:block;font-size:11px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--slate);margin-bottom:5px;}
  .champ input[type=text],.champ textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font:inherit;font-size:13px;}
  .champ textarea{resize:vertical;line-height:1.5;} .champ textarea.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;min-height:240px;}
  .nom-row{display:flex;gap:8px;} .nom-row input{flex:1;}
  .btn-maj{border:1px solid var(--line);background:#fff;border-radius:8px;padding:0 12px;font:inherit;font-weight:700;font-size:12px;cursor:pointer;color:var(--slate);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .geo{display:flex;gap:8px;align-items:end;margin-bottom:14px;}
  .geo .champ{flex:1;margin:0;} .geo button{border:0;background:var(--teal);color:#fff;border-radius:8px;padding:9px 13px;font:inherit;font-weight:600;font-size:12px;cursor:pointer;white-space:nowrap;height:38px;}
  .cats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .tri{border:1px solid var(--line);border-radius:9px;padding:8px 10px;} .tri .t-lbl{font-size:12px;font-weight:600;margin-bottom:6px;}
  .tri .opts{display:flex;gap:4px;} .tri .opts button{flex:1;border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px;font:inherit;font-size:11px;font-weight:600;cursor:pointer;color:var(--muted);}
  .tri .opts button.oui.on{background:var(--ok);color:#fff;border-color:var(--ok);} .tri .opts button.non.on{background:var(--no);color:#fff;border-color:var(--no);} .tri .opts button.vide.on{background:var(--slate);color:#fff;border-color:var(--slate);}
  .preview{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#fff;font-size:13px;line-height:1.45;max-height:360px;overflow:auto;}
  .preview table{border-collapse:collapse;width:100%;font-size:12px;margin:6px 0;} .preview td,.preview th{border:1px solid var(--line);padding:5px 7px;} .preview td:first-child{text-align:center;width:22px;} .preview a{color:var(--teal);}
  .preview details{margin:8px 0;border:1px solid var(--line);border-radius:8px;} .preview summary{cursor:pointer;font-weight:700;padding:6px 9px;background:var(--violet-soft);}
  .preview .adresse{margin:2px 0;} .preview .adr-titre{font-weight:700;margin:8px 0 3px;}
  .sect-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);margin:18px 0 8px;}
  .import{display:none;} body.mode-import .edit{display:none;} body.mode-import .import{display:block;}
  .imp-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .imp-src textarea{width:100%;min-height:420px;border:1px solid var(--line);border-radius:8px;padding:11px;font:inherit;font-size:13px;}
  .imp-fields{max-height:480px;overflow:auto;} .imp-field{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px;}
  .imp-field .fh{display:flex;justify-content:space-between;gap:8px;margin-bottom:5px;} .imp-field .name{font-size:12px;font-weight:600;color:var(--slate);}
  .imp-field .fh button{border:1px solid var(--violet);background:var(--violet-soft);color:var(--violet);border-radius:6px;font:inherit;font-size:11px;font-weight:600;padding:4px 8px;cursor:pointer;}
  .imp-field textarea{width:100%;min-height:34px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit;font-size:12px;}
  .imp-actions{margin-top:14px;} .imp-actions .inject{background:var(--violet);color:#fff;border:0;border-radius:8px;padding:11px 20px;font:inherit;font-weight:700;cursor:pointer;}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--slate);color:#fff;padding:10px 18px;border-radius:9px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:100;} .toast.show{opacity:1;}
  @media (max-width:820px){aside{width:190px;} .grid2,.cats,.imp-grid{grid-template-columns:1fr;}}
</style>
</head>
<body class="mode-edit">
<header>
  <div class="brand"><span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.5-7-11a7 7 0 0 1 14 0c0 4.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.6"/></svg></span><h1>Éditeur des associations</h1></div>
  <div class="htools">
    <button class="b-mode on" id="m-edit" type="button">Édition</button>
    <button class="b-mode" id="m-import" type="button">Import</button>
    <span id="maj-label"></span>
    <input type="file" id="file" accept=".geojson,.json" style="display:none">
    <button class="b-ghost" id="b-open" type="button"><i class="fa fa-folder-open"></i> Charger</button>
    <button class="b-save" id="b-save" type="button"><i class="fa fa-download"></i> Sauvegarder</button>
  </div>
</header>
<div class="layout">
  <aside>
    <div class="search"><input type="text" id="q" placeholder="Rechercher..."></div>
    <div class="liste" id="liste"></div>
    <div class="add"><button id="b-add"><i class="fa fa-plus"></i> Ajouter</button></div>
  </aside>
  <main>
    <div class="edit">
      <div class="navbar"><button id="prev">&lsaquo;</button><button id="next">&rsaquo;</button><span class="pos" id="pos"></span><button class="del" id="b-del"><i class="fa fa-trash"></i> Supprimer</button></div>
      <div class="champ"><label>Nom de l&rsquo;association</label><div class="nom-row"><input type="text" id="f-nom"><button class="btn-maj" id="b-maj" title="Mettre en majuscules">MAJ</button></div></div>
      <div class="champ"><label>Logo (fichier pict/ ou texte court, vide = nom)</label><input type="text" id="f-logo" placeholder="ola.png / P-V! / (vide)"></div>
      <div class="geo">
        <div class="champ"><label>Adresse à géocoder (lieu public)</label><input type="text" id="f-adr-geo" placeholder="1 rue ..., 75000 Paris"></div>
        <button id="b-geo"><i class="fa fa-map-marker"></i> Trouver</button>
      </div>
      <div class="grid2"><div class="champ"><label>Longitude</label><input type="text" id="f-lng"></div><div class="champ"><label>Latitude</label><input type="text" id="f-lat"></div></div>
      <div class="champ"><label>Statut</label><div class="tri" style="max-width:220px"><div class="opts"><button class="oui" data-act="1">Active</button><button class="non" data-act="0">Inactive</button></div></div></div>
      <div class="sect-title">Cases (vide = non exportée)</div>
      <div class="cats" id="cats"></div>
      <div class="sect-title">Fiche (Markdown / syntaxe icônes)</div>
      <div class="grid2"><div class="champ"><label>Source</label><textarea class="mono" id="f-fiche"></textarea></div><div class="champ"><label>Aperçu</label><div class="preview" id="preview"></div></div></div>
    </div>
    <div class="import">
      <div class="sect-title">Import assisté — collez la source, affectez chaque bloc, puis injectez</div>
      <div class="imp-grid">
        <div class="imp-fields" id="imp-fields"></div>
        <div class="imp-src"><label style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--slate);display:block;margin-bottom:5px;">Texte source</label><textarea id="imp-source" placeholder="Collez le texte, sélectionnez un passage, cliquez « coller » en face de la case."></textarea></div>
      </div>
      <div class="imp-actions"><button class="inject" id="b-inject"><i class="fa fa-download"></i> Injecter dans la fiche</button></div>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>

function b64utf8(b){return decodeURIComponent(Array.prototype.map.call(atob(b),function(c){return "%"+("00"+c.charCodeAt(0).toString(16)).slice(-2);}).join(""));}

const CATS=[["bariatrique","Bariatrique"],["adultes","Adultes"],["adolescents","Adolescents"],["enfants","Enfants"],["pairs_inclus","Pairs inclus"],["pros_inclus","Pros inclus"]];
function dateAuj(){var d=new Date();function z(n){return (n<10?"0":"")+n;}return z(d.getDate())+"/"+z(d.getMonth()+1)+"/"+d.getFullYear();}
let data=store.get("data")||JSON.parse(b64utf8(FULL_B64)); let cur=0; let filtre="";
function majAffichageDate(){var el=document.getElementById("maj-label");el.textContent=data.date_maj?("MàJ : "+data.date_maj):"MàJ : (à la sauvegarde)";}

/* rendu apercu (aligne sur la carte) */
marked.setOptions({breaks:false,gfm:true});
function preprocessFiche(txt){
  txt=txt.replace(/```diaporama[\s\S]*?```/g,"").replace(/!\(img_[A-Za-z0-9]+\)/g,"").replace(/--\]/g,"");
  txt=txt.replace(/!\(!?\((https?:\/\/[^\s)]+)[^)]*\)[^)]*\)/g,"[vidéo]").replace(/!\((https?:\/\/[^\s)]+)(?:\s+\d+x\d+)?\)/g,"[vidéo]");
  txt=txt.replace(/\[([^\]]+)\]\(app:\/\/moveTo\?[^)]*\)/g,"$1");
  txt=txt.replace(/\[\+\+\s*(.+?)\s*\+\+\]\s*(?:<br>)?\s*([\s\S]*?)\[----\]/g,function(m,t,c){var l=c.split(/<br>|\n/).map(function(x){return x.replace(/^\s*\|?\s*/,'').trim();}).filter(function(x){return x.length;});var it=l.map(function(x){return '<div class="adresse">'+x+'</div>';}).join("");if(l.length<=1)return "\n\n"+it+"\n\n";return '\n\n<details open><summary>'+t+' ('+l.length+')</summary>'+it+'</details>\n\n';});
  txt=txt.replace(/\[--\s*(.+?)\s*--\]/g,'\n<div class="adr-titre">$1</div>\n');
  txt=txt.replace(/^[ \t]*:fa-plus-square:(?::?#[0-9a-fA-F]{3,6}:)?[ \t]*(.+)$/gm,'<div class="adresse"><i class="fa fa-plus-square" style="color:#A2368F"></i> $1</div>');
  txt=txt.replace(/\*\*[ \t]*(.+?)[ \t]*\*\*/g,"**$1**");
  txt=txt.replace(/:fa-([a-z0-9-]+):(?::?#([0-9a-fA-F]{3,6}):)?/g,function(m,n,h){return h?'<i class="fa fa-'+n+'" style="color:#'+h+'"></i>':'<i class="fa fa-'+n+'"></i>';});
  return txt;
}
function rafraichirApercu(){document.getElementById("preview").innerHTML=marked.parse(preprocessFiche(document.getElementById("f-fiche").value||""));}

function rendreListe(){var el=document.getElementById("liste");el.innerHTML="";data.features.forEach(function(f,i){var nom=f.properties.nom||"(sans nom)";if(filtre&&nom.toLowerCase().indexOf(filtre)<0)return;var d=document.createElement("div");d.className="item"+(i===cur?" sel":"")+(f.properties.active===false?" inactif":"");d.innerHTML='<span class="pastille"></span>'+nom;d.addEventListener("click",function(){selectionner(i);});el.appendChild(d);});}
function props(){return data.features[cur].properties;} function coords(){return data.features[cur].geometry.coordinates;}
function selectionner(i){sauverChamps();cur=i;chargerChamps();rendreListe();}
function chargerChamps(){if(!data.features.length){document.getElementById("pos").textContent="0 / 0";return;}var p=props(),c=coords();
  document.getElementById("f-nom").value=p.nom||"";document.getElementById("f-logo").value=p.logo||"";
  document.getElementById("f-lng").value=c[0];document.getElementById("f-lat").value=c[1];
  document.getElementById("pos").textContent=(cur+1)+" / "+data.features.length;
  document.querySelectorAll('.tri [data-act]').forEach(function(b){b.classList.toggle("on",(b.dataset.act==="1")===(p.active!==false));});
  CATS.forEach(function(cc){var v=p[cc[0]]===undefined?"":p[cc[0]];document.querySelectorAll('[data-cat="'+cc[0]+'"] button').forEach(function(b){b.classList.toggle("on",b.dataset.val===v);});});
  document.getElementById("f-fiche").value=p.fiche||"";rafraichirApercu();}
function sauverChamps(){if(!data.features.length)return;var p=props(),c=coords();p.nom=document.getElementById("f-nom").value.trim();p.logo=document.getElementById("f-logo").value.trim();var lng=parseFloat(document.getElementById("f-lng").value),lat=parseFloat(document.getElementById("f-lat").value);if(!isNaN(lng))c[0]=lng;if(!isNaN(lat))c[1]=lat;p.fiche=document.getElementById("f-fiche").value;}

document.querySelectorAll('.tri [data-act]').forEach(function(b){b.addEventListener("click",function(){props().active=(b.dataset.act==="1");document.querySelectorAll('.tri [data-act]').forEach(function(x){x.classList.toggle("on",x===b);});rendreListe();});});
(function(){var host=document.getElementById("cats");CATS.forEach(function(cc){var box=document.createElement("div");box.className="tri";box.setAttribute("data-cat",cc[0]);box.innerHTML='<div class="t-lbl">'+cc[1]+'</div><div class="opts"><button class="oui" data-val="oui">Oui</button><button class="non" data-val="non">Non</button><button class="vide" data-val="">Vide</button></div>';box.querySelectorAll("button").forEach(function(b){b.addEventListener("click",function(){var v=b.dataset.val;if(v==="")delete props()[cc[0]];else props()[cc[0]]=v;box.querySelectorAll("button").forEach(function(x){x.classList.toggle("on",x===b);});});});host.appendChild(box);});})();

document.getElementById("f-fiche").addEventListener("input",rafraichirApercu);
document.getElementById("f-nom").addEventListener("input",function(){props().nom=this.value;rendreListe();});
document.getElementById("b-maj").addEventListener("click",function(){var i=document.getElementById("f-nom");i.value=i.value.toUpperCase();props().nom=i.value;rendreListe();});
document.getElementById("prev").addEventListener("click",function(){if(cur>0)selectionner(cur-1);});
document.getElementById("next").addEventListener("click",function(){if(cur<data.features.length-1)selectionner(cur+1);});
document.getElementById("q").addEventListener("input",function(){filtre=this.value.toLowerCase().trim();rendreListe();});
document.getElementById("b-add").addEventListener("click",function(){sauverChamps();data.features.push({type:"Feature",geometry:{type:"Point",coordinates:[2.4,46.7]},properties:{nom:"NOUVELLE ASSOCIATION",active:true,logo:"",fiche:""}});cur=data.features.length-1;chargerChamps();rendreListe();toast("Ajoutée");});
document.getElementById("b-del").addEventListener("click",function(){if(!data.features.length)return;if(!confirm("Supprimer \""+(props().nom||"")+"\" ?"))return;data.features.splice(cur,1);if(cur>=data.features.length)cur=Math.max(0,data.features.length-1);chargerChamps();rendreListe();toast("Supprimée");});

/* geocodage via API Adresse (BAN) */
document.getElementById("b-geo").addEventListener("click",function(){
  var q=document.getElementById("f-adr-geo").value.trim(); if(!q){toast("Saisissez une adresse");return;}
  toast("Recherche...");
  fetch("https://api-adresse.data.gouv.fr/search/?limit=1&q="+encodeURIComponent(q)).then(function(r){return r.json();}).then(function(j){
    if(j.features&&j.features.length){var c=j.features[0].geometry.coordinates;var pr=j.features[0].properties;
      document.getElementById("f-lng").value=c[0].toFixed(6);document.getElementById("f-lat").value=c[1].toFixed(6);
      var co=coords();co[0]=c[0];co[1]=c[1];
      toast("Trouvé : "+(pr.label||"")+" (score "+Math.round((pr.score||0)*100)+"%) — vérifiez");
    } else toast("Adresse introuvable");
  }).catch(function(){toast("Géocodage indisponible (connexion ?)");});
});

/* sauvegarde */
function nettoyerPourExport(){var out={type:"FeatureCollection",date_maj:dateAuj(),features:data.features.map(function(f){var p=f.properties,np={nom:p.nom||"",active:p.active!==false,logo:p.logo||"",fiche:p.fiche||""};CATS.forEach(function(cc){if(p[cc[0]]==="oui"||p[cc[0]]==="non")np[cc[0]]=p[cc[0]];});return {type:"Feature",geometry:f.geometry,properties:np};})};return out;}
document.getElementById("b-save").addEventListener("click",function(){sauverChamps();var out=nettoyerPourExport();data.date_maj=out.date_maj;majAffichageDate();store.set("data",data);var blob=new Blob([JSON.stringify(out,null,1)],{type:"application/geo+json"});var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="Carte_Obesite.geojson";a.click();toast("Sauvegardé ("+out.features.length+" assos)");});
document.getElementById("b-open").addEventListener("click",function(){document.getElementById("file").click();});
document.getElementById("file").addEventListener("change",function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var j=JSON.parse(r.result);if(!j.features)throw 0;data=j;cur=0;chargerChamps();rendreListe();majAffichageDate();toast("Chargé : "+data.features.length);}catch(e){alert("GeoJSON invalide");}};r.readAsText(f);});

/* import assiste */
const IMPORT_FIELDS=[["adresse","Adresse"],["courriel","Courriel"],["telephone","Téléphone"],["site","Site web"],["facebook","Facebook"],["instagram","Instagram"],["brochure","Brochure"],["public","Public accepté"],["mode","Mode d échanges"],["affiliation","Affiliation"],["partenariat","Partenariat"],["agrements","Agréments"],["composition","Composition"],["rna","N° RNA"],["presentation","Présentation"],["video","Vidéo"]];
(function(){var host=document.getElementById("imp-fields");IMPORT_FIELDS.forEach(function(f){var d=document.createElement("div");d.className="imp-field";d.innerHTML='<div class="fh"><span class="name">'+f[1]+'</span><button data-k="'+f[0]+'">&laquo; coller</button></div><textarea data-fk="'+f[0]+'"></textarea>';host.appendChild(d);});host.querySelectorAll('button[data-k]').forEach(function(b){b.addEventListener("click",function(){var src=document.getElementById("imp-source");var sel=src.value.substring(src.selectionStart,src.selectionEnd).trim();if(!sel){toast("Sélectionnez un passage");return;}var ta=host.querySelector('textarea[data-fk="'+b.dataset.k+'"]');ta.value=(ta.value?ta.value+"\n":"")+sel;});});})();
function iv(k){var t=document.querySelector('#imp-fields textarea[data-fk="'+k+'"]');return t?t.value.trim():"";}
function br(s){return s.replace(/\n/g,"<br>");} function lg(ic,c){return "| :fa-"+ic+"::#A2368F:|"+c+"|";}
document.getElementById("b-inject").addEventListener("click",function(){if(!data.features.length){toast("Ajoutez une asso");return;}var L=["| :fa-info:#A2368F:|**Identification**|","| ---- | ---- |"];if(iv("adresse"))L.push(lg("map-o",br(iv("adresse"))));if(iv("courriel"))L.push(lg("envelope","[Courriel](mailto:"+iv("courriel")+")"));if(iv("telephone"))L.push(lg("mobile",br(iv("telephone"))));if(iv("site"))L.push(lg("chain","[Site Web]("+iv("site")+")"));if(iv("facebook"))L.push(lg("facebook-official","[FaceBook]("+iv("facebook")+")"));if(iv("instagram"))L.push(lg("instagram","[Instagram]("+iv("instagram")+")"));if(iv("brochure"))L.push(lg("file-pdf-o","[Brochure]("+iv("brochure")+")"));if(iv("public"))L.push(lg("users","Public accepté : "+br(iv("public"))));if(iv("mode"))L.push(lg("circle-o-notch","Mode d'échanges : "+br(iv("mode"))));if(iv("affiliation"))L.push(lg("tag","Affiliation: "+br(iv("affiliation"))));if(iv("partenariat"))L.push(lg("external-link","Partenariat avec : "+br(iv("partenariat"))));if(iv("agrements"))L.push(lg("certificate","Agréments : "+br(iv("agrements"))));if(iv("rna"))L.push(lg("gear",iv("rna")));var out=L.join("\n");if(iv("presentation"))out+="\n\n** :fa-newspaper-o: Présentation de l'association**<br>\n"+iv("presentation");if(iv("video"))out+="\n\n**:fa-film: Vidéo**<br>\n!("+iv("video")+")";props().fiche=out;document.getElementById("f-fiche").value=out;rafraichirApercu();basculer("edit");toast("Injecté");});

function basculer(m){document.body.className="mode-"+m;document.getElementById("m-edit").classList.toggle("on",m==="edit");document.getElementById("m-import").classList.toggle("on",m==="import");}
document.getElementById("m-edit").addEventListener("click",function(){basculer("edit");});
document.getElementById("m-import").addEventListener("click",function(){basculer("import");});
var toastT;function toast(msg){var t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove("show");},2600);}
chargerChamps();rendreListe();majAffichageDate();
</script>
</body>
</html>
