<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carte Obesite</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
<style>
  :root{--slate:#2b3242;--slate-2:#3a4256;--ink:#1c2230;--violet:#A2368F;--violet-soft:#f7ecf5;
    --teal:#0e8a7d;--paper:#f6f7f9;--line:#e3e6ec;--muted:#6b7280;}
  *{box-sizing:border-box;} html,body{height:100%;margin:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);display:flex;flex-direction:column;background:var(--paper);}
  header{background:var(--slate);color:#fff;padding:12px 18px;z-index:1200;}
  .row1{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:11px;}
  .brand h1{font-size:15px;font-weight:600;margin:0;}
  .brand .sub{font-size:11.5px;color:#aeb6c6;margin-top:2px;}
  .dot{width:26px;height:26px;border-radius:7px;background:var(--violet);display:grid;place-items:center;}
  .dot svg{width:15px;height:15px;}
  .tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .seg{display:flex;gap:5px;background:var(--slate-2);padding:4px;border-radius:9px;}
  .seg button{border:0;cursor:pointer;font:inherit;font-size:12px;font-weight:600;color:#c7cdda;
    background:transparent;padding:6px 11px;border-radius:6px;}
  .seg button.actif{background:#fff;color:var(--ink);}
  .load-btn{border:1px solid rgba(255,255,255,.25);background:transparent;color:#e7eaf1;cursor:pointer;
    font:inherit;font-size:12px;font-weight:600;padding:6px 12px;border-radius:7px;}
  .filtres{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px;align-items:center;}
  .filtres .lbl{font-size:11px;color:#aeb6c6;margin-right:2px;}
  .chip{border:1px solid rgba(255,255,255,.22);cursor:pointer;font:inherit;font-size:11.5px;font-weight:600;
    color:#e7eaf1;background:transparent;padding:5px 11px;border-radius:20px;}
  .chip.on{background:var(--violet);border-color:var(--violet);}
  #map{flex:1;width:100%;}
  #hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:900;background:#fff;
    border:1px solid var(--line);border-radius:12px;padding:20px 24px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.12);max-width:340px;}
  #hint p{margin:0 0 12px;font-size:13px;color:var(--muted);}
  #hint button{background:var(--violet);color:#fff;border:0;border-radius:8px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer;}
  .leaflet-popup-content-wrapper{border-radius:12px;box-shadow:0 10px 30px rgba(20,28,45,.2);}
  .leaflet-popup-content{margin:0 !important;width:280px !important;}
  .pop-logo{width:100%;height:96px;object-fit:contain;background:var(--violet-soft);border-radius:12px 12px 0 0;padding:10px;}
  .pop-logo.vide{display:flex;align-items:center;justify-content:center;color:#b98bb0;font-size:12px;}
  .fiche-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:12px 14px 0;}
  .fiche-head h2{font-size:15px;margin:0;color:var(--ink);line-height:1.25;}
  .cats{display:flex;gap:5px;flex-wrap:wrap;padding:8px 14px 0;}
  .cat{font-size:10px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:#fff;
    background:var(--violet);padding:3px 8px;border-radius:20px;}
  .cat.bariatrique{background:#b45309;} .cat.enfants{background:#0e8a7d;}
  .cat.adolescent{background:#2563eb;} .cat.pair-aidant{background:#7c3aed;}
  .actions{display:flex;gap:6px;padding:8px 14px 0;}
  .actions button{flex:1;border:1px solid var(--line);background:#fff;cursor:pointer;border-radius:8px;
    padding:7px;font:inherit;font-size:12px;font-weight:600;color:var(--slate);display:flex;align-items:center;justify-content:center;gap:6px;}
  .actions button:hover{background:var(--paper);}
  .fiche{padding:8px 14px 14px;max-height:240px;overflow:auto;line-height:1.45;font-size:13px;color:#374151;}
  .fiche table{border-collapse:collapse;width:100%;margin:6px 0;font-size:12px;}
  .fiche td,.fiche th{border:1px solid var(--line);padding:5px 7px;vertical-align:top;}
  .fiche td:first-child{width:22px;text-align:center;}
  .fiche a{color:var(--teal);text-decoration:none;border-bottom:1px solid rgba(14,138,125,.35);}
  .fiche h3{font-size:13px;margin:10px 0 4px;color:var(--slate);}
  .fiche .video{position:relative;padding-bottom:56%;height:0;margin:8px 0;border-radius:8px;overflow:hidden;}
  .fiche .video iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
  .fiche ul{margin:6px 0;padding-left:18px;}
  .pin{filter:drop-shadow(0 3px 4px rgba(20,28,45,.35));transition:opacity .2s,transform .2s;}
  .attenue{opacity:.28;} .accentue{transform:scale(1.18);}
  .modal{position:fixed;inset:0;background:rgba(20,28,45,.55);z-index:3000;display:none;align-items:center;justify-content:center;padding:22px;}
  .modal.ouvert{display:flex;}
  .modal-box{background:#fff;border-radius:14px;max-width:640px;width:100%;max-height:88vh;overflow:auto;}
  .modal-bar{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:14px 20px;}
  .modal-bar span{font-size:11px;font-weight:700;letter-spacing:.4px;color:var(--violet);text-transform:uppercase;}
  .modal-bar button{border:0;background:var(--paper);cursor:pointer;border-radius:8px;width:32px;height:32px;font-size:18px;}
  .modal .fiche{max-height:none;padding:18px 26px 30px;font-size:14px;}
  footer{background:#fff;border-top:1px solid var(--line);font-size:11px;color:var(--muted);padding:7px 18px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  @media (max-width:600px){.leaflet-popup-content{width:220px !important;}.modal{padding:0;}.modal-box{border-radius:0;height:100vh;max-height:100vh;}}
</style>
</head>
<body>
<header>
  <div class="row1">
    <div class="brand">
      <span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.5-7-11a7 7 0 0 1 14 0c0 4.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.6"/></svg></span>
      <div><h1>Carte Obesite</h1><div class="sub">associations &mdash; reseau OMEAVE</div></div>
    </div>
    <div class="tools">
      <div class="seg" id="zones">
        <button data-zone="metropole" class="actif" type="button">Metropole</button>
        <button data-zone="idf" type="button">IDF</button>
        <button data-zone="reunion" type="button">Reunion</button>
        <button data-zone="antilles" type="button">Antilles</button>
      </div>
      <div class="seg" id="fonds">
        <button id="btn-ign" class="actif" type="button">IGN</button>
        <button id="btn-osm" type="button">OSM</button>
      </div>
    </div>
  </div>
  <div class="filtres" id="filtres"><span class="lbl">Filtrer :</span></div>
</header>
<div id="map"></div>
<div id="hint" style="display:none">
  <p><b>Carte_Obesite.geojson</b> introuvable a cote de cette page.<br>Il doit se trouver dans le meme dossier que ce fichier HTML.</p>
</div>
<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="modal-box"><div class="modal-bar"><span id="modal-tag"></span><button id="modal-close">&times;</button></div><div class="fiche" id="modal-fiche"></div></div>
</div>
<footer><span>Reseau OMEAVE &mdash; donnees associations.</span><span>Fonds IGN Geoplateforme / OpenStreetMap.</span></footer>

<script>

const CATS=[["bariatrique","Bariatrique"],["enfants","Enfants"],["adolescent","Adolescent"],["pair_aidant","Pair-Aidant"]];

/* ---- rendu de fiche (syntaxe Ma Carte) ---- */
function preprocessFiche(txt){
  txt=txt.replace(/!\(img_[A-Za-z0-9]+\)/g,"");
  // video !(url WxH)
  txt=txt.replace(/!\((https?:\/\/[^\s)]+)(?:\s+\d+x\d+)?\)/g,function(m,url){
    var id=null,y=url.match(/(?:youtu\.be\/|v=)([A-Za-z0-9_-]{6,})/);
    if(y) id=y[1];
    if(id) return '<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/'+id+'" allowfullscreen loading="lazy"></iframe></div>';
    return '<a href="'+url+'" target="_blank" rel="noopener">'+url+'</a>';
  });
  // blocs [-- Titre --] et [----]
  txt=txt.replace(/\[--\s*(.*?)\s*--\]/g,function(m,t){return "\n### "+t+"\n";});
  txt=txt.replace(/\[----\]/g,"\n");
  // liens moveTo (on retire l infobulle apres l espace)
  txt=txt.replace(/\[([^\]]+)\]\(app:\/\/moveTo\?(-?[\d.]+),(-?[\d.]+)[^)]*\)/g,
    function(m,lab,lng,lat){return '<a href="app://moveTo?'+lng+','+lat+'">'+lab+'</a>';});
  // icones FA :fa-nom::#hex: / :fa-nom:#hex: / :fa-nom:
  txt=txt.replace(/:fa-([a-z0-9-]+):(?::?#([0-9a-fA-F]{3,6}):)?/g,function(m,nom,hex){
    return hex?'<i class="fa fa-'+nom+'" style="color:#'+hex+'"></i>':'<i class="fa fa-'+nom+'"></i>';});
  return txt;
}
function renderFiche(txt){ return marked.parse(preprocessFiche(txt)); }
function ficheTexte(txt){ // version texte brut pour le mail
  var t=txt.replace(/!\(img_[A-Za-z0-9]+\)/g,"");
  t=t.replace(/:fa-[a-z0-9-]+:(?::?#[0-9a-fA-F]{3,6}:)?/g,"");
  t=t.replace(/\[([^\]]+)\]\((?:app:\/\/moveTo\?[^)]*|[^)]*)\)/g,"$1");
  t=t.replace(/\[--\s*(.*?)\s*--\]/g,"\n$1\n").replace(/\[----\]/g,"");
  t=t.replace(/<br>/g,"\n").replace(/[|*#>]/g," ").replace(/\n{3,}/g,"\n\n");
  return t.split("\n").map(function(l){return l.trim();}).join("\n").trim();
}

/* ---- fonds ---- */
const fondIGN=L.tileLayer("https://data.geopf.fr/wmts?SERVICE=WMTS&VERSION=1.0.0&REQUEST=GetTile&LAYER=GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2&STYLE=normal&FORMAT=image/png&TILEMATRIXSET=PM&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}",
  {minZoom:3,maxZoom:18,attribution:'&copy; <a href="https://www.ign.fr/" target="_blank">IGN</a> Geoplateforme'});
const fondOSM=L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  {minZoom:3,maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>'});
const map=L.map("map",{center:[46.7,2.4],zoom:6,layers:[fondIGN]});

function pin(c){
  var svg='<svg class="pin" width="30" height="40" viewBox="0 0 30 40" xmlns="http://www.w3.org/2000/svg"><path d="M15 0C7 0 1 6 1 14c0 9 14 26 14 26s14-17 14-26C29 6 23 0 15 0z" fill="'+c+'"/><circle cx="15" cy="14" r="5.5" fill="#fff"/></svg>';
  return L.divIcon({html:svg,className:"",iconSize:[30,40],iconAnchor:[15,40],popupAnchor:[0,-36]});
}

let markers=[];
let filtresActifs=[];

function catsActives(props){ return CATS.filter(function(c){return props[c[0]]==="oui";}); }

function construirePopup(props){
  var logo=props.logo
    ? '<img class="pop-logo" src="'+props.logo+'" alt="logo" onerror="this.outerHTML=\'<div class=&quot;pop-logo vide&quot;>logo a venir</div>\'">'
    : '<div class="pop-logo vide">logo a venir</div>';
  var cats=catsActives(props).map(function(c){return '<span class="cat '+c[0].replace("_","-")+'">'+c[1]+'</span>';}).join("");
  var head='<div class="fiche-head"><h2>'+(props.nom||"")+'</h2></div>';
  var catsBloc=cats?'<div class="cats">'+cats+'</div>':"";
  var actions='<div class="actions">'+
    '<button class="b-mail"><i class="fa fa-envelope"></i> Par mail</button>'+
    '<button class="b-grand"><i class="fa fa-expand"></i> Agrandir</button></div>';
  return logo+head+catsBloc+actions+'<div class="fiche">'+renderFiche(props.fiche||"")+'</div>';
}

function chargerFeatures(fc){
  markers.forEach(function(m){map.removeLayer(m);}); markers=[];
  document.getElementById("hint").style.display="none";
  (fc.features||[]).forEach(function(ft){
    var props=ft.properties||{}, co=ft.geometry.coordinates;
    var m=L.marker([co[1],co[0]],{icon:pin("#A2368F"),title:props.nom});
    m._props=props; m._tag=props.nom;
    m.bindPopup(construirePopup(props),{maxWidth:300,minWidth:230});
    markers.push(m);
  });
  appliquerFiltres();
}

function appliquerFiltres(){
  markers.forEach(function(m){
    var ok = filtresActifs.length===0 || filtresActifs.every(function(k){return m._props[k]==="oui";});
    if(ok && !map.hasLayer(m)) m.addTo(map);
    if(!ok && map.hasLayer(m)) map.removeLayer(m);
  });
}

/* filtres UI */
const filtresEl=document.getElementById("filtres");
CATS.forEach(function(c){
  var b=document.createElement("button"); b.className="chip"; b.textContent=c[1];
  b.addEventListener("click",function(){
    if(filtresActifs.includes(c[0])){filtresActifs=filtresActifs.filter(function(x){return x!==c[0];});b.classList.remove("on");}
    else{filtresActifs.push(c[0]);b.classList.add("on");}
    appliquerFiltres();
  });
  filtresEl.appendChild(b);
});

/* highlight + boutons popup */
map.on("popupopen",function(e){
  var src=e.popup._source;
  markers.forEach(function(m){var el=m._icon;if(!el)return;var s=el.querySelector(".pin");if(!s)return;
    s.classList.remove("attenue","accentue"); if(m===src)s.classList.add("accentue"); });
  var root=e.popup.getElement();
  var bg=root.querySelector(".b-grand"); if(bg)bg.addEventListener("click",function(){ouvrirModal(src._tag,construirePopup(src._props));});
  var bm=root.querySelector(".b-mail"); if(bm)bm.addEventListener("click",function(){
    var corps=ficheTexte(src._props.fiche||"");
    window.location.href="mailto:?subject="+encodeURIComponent(src._props.nom||"Association")+"&body="+encodeURIComponent(corps);
  });
});
map.on("popupclose",function(){markers.forEach(function(m){var el=m._icon;if(!el)return;var s=el.querySelector(".pin");if(s)s.classList.remove("attenue","accentue");});});

/* modale */
const modal=document.getElementById("modal");
function ouvrirModal(tag,html){document.getElementById("modal-tag").textContent=tag;document.getElementById("modal-fiche").innerHTML='<div class="fiche" style="max-height:none;padding:0">'+html+'</div>';modal.classList.add("ouvert");}
document.getElementById("modal-close").addEventListener("click",function(){modal.classList.remove("ouvert");});
modal.addEventListener("click",function(e){if(e.target===modal)modal.classList.remove("ouvert");});

/* moveTo */
document.addEventListener("click",function(e){
  var a=e.target.closest('a[href^="app://moveTo?"]'); if(!a)return; e.preventDefault();
  var c=a.getAttribute("href").split("?")[1].split(" ")[0].split(",");
  var lng=parseFloat(c[0]),lat=parseFloat(c[1]);
  if(!isNaN(lat)&&!isNaN(lng)){modal.classList.remove("ouvert");map.closePopup();map.flyTo([lat,lng],14);}
});

/* zones + fonds */
const ZONES={metropole:[[46.7,2.4],6],idf:[[48.77,2.55],9],reunion:[[-21.11,55.53],10],antilles:[[15.5,-61.4],8]};
document.querySelectorAll("#zones button").forEach(function(b){b.addEventListener("click",function(){
  document.querySelectorAll("#zones button").forEach(function(x){x.classList.remove("actif");});b.classList.add("actif");
  var z=ZONES[b.dataset.zone];map.flyTo(z[0],z[1]);});});
const btnIGN=document.getElementById("btn-ign"),btnOSM=document.getElementById("btn-osm");
btnIGN.addEventListener("click",function(){if(map.hasLayer(fondOSM))map.removeLayer(fondOSM);fondIGN.addTo(map);btnIGN.classList.add("actif");btnOSM.classList.remove("actif");});
btnOSM.addEventListener("click",function(){if(map.hasLayer(fondIGN))map.removeLayer(fondIGN);fondOSM.addTo(map);btnOSM.classList.add("actif");btnIGN.classList.remove("actif");});


/* init : la carte charge TOUJOURS Carte_Obesite.geojson (meme dossier) */
fetch("Carte_Obesite.geojson",{cache:"no-cache"}).then(function(r){if(!r.ok)throw 0;return r.json();})
  .then(function(fc){chargerFeatures(fc);})
  .catch(function(){ document.getElementById("hint").style.display="block"; });
</script>
</body>
</html>
